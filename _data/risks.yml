# Предупреждения: показываются, когда сочетание ответов или решений опасно.
- text: "SQLite при нескольких инстансах приложения работать не будет: файл БД не разделяется между серверами. Либо один процесс, либо PostgreSQL."
  needs: [sqlite]
  if: { scale: [medium, large, huge] }
  level: high

- text: "Локальное хранилище файлов и несколько инстансов несовместимы — загруженный на один сервер файл не увидит второй. Нужно S3-совместимое хранилище."
  needs: [as_local]
  if: { scale: [large, huge] }
  level: high

- text: "Solid Queue живёт в основной БД. На выбранном масштабе заложите отдельную базу под очередь или мониторьте конкуренцию с вебом."
  needs: [solid_trifecta]
  if: { scale: [large, huge] }
  level: medium

- text: "Ransack без явного `ransackable_attributes` открывает фильтрацию по любому полю модели — включая приватные. Brakeman отдельно проверяет это (CheckRansack)."
  needs: [ransack_addon]
  level: high

- text: "Платежи без `idempotency_key` в таблице: повторный вебхук или ретрай после таймаута создаст вторую запись и двойное списание. Уникальный индекс по ключу обязателен."
  needs: [sec_payments]
  level: high

- text: "OmniAuth без гема `omniauth-rails_csrf_protection` уязвим к CSRF на этапе редиректа к провайдеру. Ставится одной строкой, забывается регулярно."
  needs: [omniauth_addon]
  level: high

- text: "JWT нельзя отозвать без списка отзыва. Короткий TTL (15 минут) + refresh-токен — минимальная рабочая схема."
  needs: [jwt_addon]
  level: medium

- text: "Микросервисы при команде меньше 20 человек почти всегда обходятся дороже монолита: инфраструктурный налог платится сразу, выгода приходит нескоро."
  needs: [microservices]
  if: { team: [solo, rails_small] }
  level: high

- text: "Без автоматических тестов на долгом горизонте любой рефакторинг становится ставкой вслепую. Это единственный пункт из плана, который нельзя отложить «на потом»."
  needs: [smoke_only]
  if: { timeline: [product, longterm] }
  level: high

- text: "SEO критично, но выбран клиентский рендеринг — потребуется отдельный SSR-процесс (Node) со своим деплоем и мониторингом. Заложите это в оценку."
  needs: [spa_api, ssr_inertia]
  if: { seo: [critical] }
  level: medium

- text: "GraphQL без dataloader'а гарантированно даст N+1 на вложенных полях. Заложите время на батчинг с самого начала."
  needs: [graphql]
  level: medium

- text: "Персональные данные попадают в Sentry вместе с параметрами запроса. Настройте `before_send` и фильтрацию полей до первого релиза."
  needs: [obs_sentry, obs_full]
  if: { compliance: [pii, fintech, gov] }
  level: medium

- text: "Rails-приложение исполняет пользовательский код или обращается к внешним LLM — обязательны таймауты, лимиты памяти и жёсткий rate limit на эндпоинт."
  if: { project_type: [ai_agent] }
  level: medium

- text: "Статический хостинг не хранит пользовательские данные. Формы, авторизация и любое состояние потребуют внешнего сервиса — убедитесь, что это приемлемо."
  needs: [github_pages_static, ssg]
  level: medium

- text: "Kamal предполагает, что сервер обслуживаете вы: обновления ОС, бэкапы и мониторинг не входят в комплект. Заложите час в неделю на эксплуатацию."
  needs: [kamal_vps, kamal_multi]
  if: { team: [solo] }
  level: low

- text: "Полный набор объектных слоёв при начинающей команде превращается в карго-культ: слои появляются, а логика всё равно живёт в контроллерах. Вводите их по одному, по мере боли."
  needs: [full_toolbox]
  if: { rails_exp: [junior] }
  level: medium
