- id: rendering
  title: "SSR vs CSR vs SSG"
  lead: "Где именно собирается HTML — определяющий выбор, от него зависят SEO, скорость первого экрана и вся структура фронтенда."
  columns: ["SSR", "CSR", "SSG"]
  rows:
    - { k: "Где рендерится HTML", v: ["На сервере при каждом запросе", "В браузере из пустого HTML + JS", "На сборке, один раз"] }
    - { k: "Первый экран", v: ["Быстро — HTML готов", "Медленно — сначала грузится JS", "Мгновенно — файл с CDN"] }
    - { k: "SEO", v: ["Отлично", "Требует SSR-прослойки или пререндера", "Идеально"] }
    - { k: "Персонализация", v: ["Любая", "Любая", "Только на клиенте через API"] }
    - { k: "Данные в реальном времени", v: ["Turbo Streams / WebSocket", "Родная территория", "Невозможно без внешнего сервиса"] }
    - { k: "Стоимость хостинга", v: ["Сервер", "Сервер для API + статика", "Бесплатно (GitHub Pages)"] }
    - { k: "В Rails это", v: ["ERB/Phlex + Hotwire — дефолт", "Rails API + React/Vue", "Jekyll, Bridgetown, Nanoc"] }
  verdict: "Для Rails по умолчанию берите SSR + Hotwire. CSR оправдан только при клиентском приложении с богатым состоянием. SSG — для контента без пользовательских данных (эта страница именно такая)."

- id: solid_vs_redis
  title: "Solid Trifecta vs Redis + Sidekiq"
  lead: "Rails 8 сделал ставку на базу данных вместо Redis. Разбираемся, где эта ставка выигрывает, а где нет."
  columns: ["Solid Trifecta", "Sidekiq + Redis"]
  rows:
    - { k: "Хранилище", v: ["Ваша БД (PostgreSQL/SQLite/MySQL)", "Redis"] }
    - { k: "Сервисов в проде", v: ["0 дополнительных", "+1 (Redis: память, персистентность, мониторинг)"] }
    - { k: "Пропускная способность", v: ["Тысячи задач/мин", "Десятки тысяч задач/мин"] }
    - { k: "Транзакционность", v: ["Задача ставится в той же транзакции, что и данные", "Задача может стартовать до коммита — нужен after_commit"] }
    - { k: "Отладка", v: ["Обычный SQL по таблице задач", "Через дашборд и redis-cli"] }
    - { k: "Дашборд", v: ["mission_control-jobs", "Sidekiq Web (зрелый)"] }
    - { k: "История выполнения", v: ["Rails 8.1 архивирует задачи вместо удаления", "Только в Pro/Enterprise"] }
    - { k: "Кэш", v: ["Solid Cache — на диске, объём в десятки ГБ дёшево", "Redis — в RAM, объём стоит денег"] }
    - { k: "WebSocket", v: ["Solid Cable", "Redis pub/sub"] }
    - { k: "Стоимость", v: ["Ноль сверх уже оплаченной БД", "$10–100+/мес за managed Redis"] }
    - { k: "Когда выбирать", v: ["До ~50 тыс. активных пользователей, один-два сервера", "Пиковые нагрузки, сложные ретраи, троттлинг, уникальность задач"] }
  verdict: "Начинайте с Solid Trifecta — она дефолт в Rails 8 и снимает целый сервис из эксплуатации. Переезжайте на Sidekiq, когда очередь начнёт конкурировать с вебом за ресурсы БД, а не «на всякий случай»."

- id: auth
  title: "Аутентификация: встроенная vs Devise vs Authentication Zero vs Rodauth"
  lead: "Rails 8 добавил генератор аутентификации — но это не значит, что Devise больше не нужен."
  columns: ["Rails 8 generate authentication", "Devise", "Authentication Zero", "Rodauth"]
  rows:
    - { k: "Тип", v: ["Генератор, код ваш", "Рантайм-гем", "Генератор, код ваш", "Рантайм-гем + свой DSL"] }
    - { k: "Сессии и вход", v: ["Есть", "Есть", "Есть", "Есть"] }
    - { k: "Сброс пароля", v: ["Есть", "Есть (recoverable)", "Есть", "Есть"] }
    - { k: "Подтверждение почты", v: ["Пишете сами", "Есть (confirmable)", "Есть", "Есть"] }
    - { k: "Блокировка после попыток", v: ["Пишете сами", "Есть (lockable)", "Есть", "Есть + защита от таймингов"] }
    - { k: "2FA / TOTP", v: ["Пишете сами", "Через сторонние гемы", "Есть из коробки", "TOTP, SMS, WebAuthn, коды восстановления"] }
    - { k: "API-токены", v: ["Пишете сами", "devise-jwt отдельно", "Генерируются сразу", "Есть (JWT-функция)"] }
    - { k: "OmniAuth", v: ["Подключаете сами", "Официально поддержан", "Генерируется", "Есть"] }
    - { k: "Порог входа", v: ["Низкий", "Низкий", "Средний", "Высокий"] }
    - { k: "Кто сопровождает код", v: ["Вы", "Мейнтейнеры гема", "Вы", "Мейнтейнеры гема"] }
    - { k: "Когда выбирать", v: ["MVP, внутренние инструменты, обучение", "Продукт с полным набором сценариев", "Смешанный веб + API, Inertia/SPA", "Финтех, госсистемы, жёсткие требования безопасности"] }
  verdict: "MVP и внутренние системы — встроенный генератор. Публичный продукт с почтой, блокировками и соцвходом — Devise. Веб + мобильный API одновременно — Authentication Zero. Регуляторные требования — Rodauth."

- id: authorization
  title: "Авторизация: Pundit vs CanCanCan vs Action Policy"
  lead: "Три способа ответить на вопрос «можно ли этому пользователю сделать это с этим объектом»."
  columns: ["Pundit", "CanCanCan", "Action Policy"]
  rows:
    - { k: "Модель", v: ["Класс политики на ресурс", "Один Ability-класс на всё", "Классы политик + композиция"] }
    - { k: "Фильтрация коллекций", v: ["Policy::Scope", "accessible_by", "Scoping с несколькими типами"] }
    - { k: "Кэширование проверок", v: ["Нет", "Нет", "Есть (важно на списках)"] }
    - { k: "Причина отказа", v: ["Нет", "Нет", "failure_reasons — можно показать пользователю"] }
    - { k: "Защита от забытой проверки", v: ["verify_authorized", "Через check_authorization", "Проверка покрытия политик в тестах"] }
    - { k: "Читаемость при 3 ролях", v: ["Хорошая", "Отличная — вся картина в одном файле", "Хорошая"] }
    - { k: "Читаемость при 10+ ролях", v: ["Хорошая", "Плохая — файл на 1000 строк", "Отличная"] }
    - { k: "Порог входа", v: ["Низкий", "Очень низкий", "Средний"] }
  verdict: "Pundit — безопасный выбор по умолчанию. CanCanCan — когда матрица «роль × ресурс» простая и хочется видеть её целиком. Action Policy — сложные правила, большие списки и большая команда."

- id: testing
  title: "Minitest vs RSpec"
  lead: "Спор старый, но выбор влияет на скорость прогона и на то, как читается набор тестов через год."
  columns: ["Minitest", "RSpec"]
  rows:
    - { k: "Установка", v: ["Уже есть после rails new", "rspec-rails + генератор"] }
    - { k: "Скорость старта", v: ["Быстрее", "Медленнее (загрузка DSL)"] }
    - { k: "Данные для тестов", v: ["Fixtures — грузятся один раз", "FactoryBot — гибче, но дороже"] }
    - { k: "Синтаксис", v: ["Обычные классы и assert", "describe/context/it — читается как спецификация"] }
    - { k: "Вывод при падении", v: ["Скупой", "Подробный, с дифом"] }
    - { k: "Параллелизация", v: ["Из коробки, порог 50 тестов", "Через parallel_tests"] }
    - { k: "Экосистема", v: ["Меньше, но всё нужное есть", "vcr, rswag, shoulda-matchers, simplecov"] }
    - { k: "В гайдах Rails", v: ["Основной вариант", "Не рассматривается"] }
  verdict: "Соло и небольшие команды — Minitest: он уже есть и быстрее. Команда от 5 человек, сложный домен или требования к отчётности — RSpec. Главная ошибка — не выбор фреймворка, а отсутствие тестов вообще."

- id: assets
  title: "Importmap vs esbuild vs Vite"
  lead: "Три способа доставить JavaScript в браузер — от полного отсутствия сборки до полноценного дев-сервера."
  columns: ["Importmap", "esbuild (jsbundling)", "Vite Ruby"]
  rows:
    - { k: "Сборка", v: ["Нет вообще", "Есть, миллисекунды", "Есть + dev-сервер"] }
    - { k: "node_modules", v: ["Не нужен", "Нужен", "Нужен"] }
    - { k: "HMR", v: ["Нет", "Нет (только перезагрузка)", "Есть"] }
    - { k: "Tree-shaking", v: ["Нет", "Есть", "Есть"] }
    - { k: "Код-сплиттинг", v: ["Нет", "Есть", "Есть, автоматический"] }
    - { k: "TypeScript / JSX", v: ["Практически нет", "Есть", "Первоклассная поддержка"] }
    - { k: "Размер Docker-образа", v: ["Минимальный", "Больше на node_modules", "Больше на node_modules"] }
    - { k: "Когда выбирать", v: ["Hotwire, немного JS — дефолт Rails 8", "Hotwire + npm-библиотеки", "Inertia, React/Vue, TypeScript"] }
  verdict: "Importmap по умолчанию. esbuild — когда понадобился первый серьёзный npm-пакет. Vite — как только фронтенд стал компонентным. Webpacker для новых проектов не выбирают: он заброшен."

- id: views
  title: "ERB vs ViewComponent vs Phlex"
  lead: "Чем описывать разметку, когда партиалов стало больше пятидесяти."
  columns: ["ERB + партиалы", "ViewComponent", "Phlex"]
  rows:
    - { k: "Контракт компонента", v: ["Неявный — какие locals нужны, знает только автор", "Явный: аргументы initialize", "Явный: аргументы initialize"] }
    - { k: "Файлов на компонент", v: ["1", "2 (класс + шаблон)", "1 (только Ruby)"] }
    - { k: "Изолированные тесты", v: ["Практически нет", "render_inline — быстрые юнит-тесты", "Обычный вызов метода"] }
    - { k: "Копирование вёрстки из макета", v: ["Прямо как есть", "Прямо как есть", "Нужно переписать в Ruby"] }
    - { k: "Производительность", v: ["Базовая", "Быстрее партиалов", "Самая быстрая"] }
    - { k: "Зрелость", v: ["Максимальная", "Высокая (GitHub в проде)", "Растущее сообщество"] }
    - { k: "Порог входа", v: ["Нулевой", "Низкий", "Средний"] }
  verdict: "Начинайте с ERB. Вводите ViewComponent, когда один и тот же блок разметки встречается в третий раз. Phlex — если команда сильна в Ruby и хочет рефакторить вёрстку инструментами IDE."

- id: api
  title: "REST vs GraphQL vs gRPC"
  lead: "Контракт с внешним миром: разные протоколы — разные проблемы."
  columns: ["REST", "GraphQL", "gRPC"]
  rows:
    - { k: "Формат", v: ["JSON поверх HTTP", "JSON, один эндпоинт", "Protobuf, бинарный"] }
    - { k: "Из браузера", v: ["Напрямую", "Напрямую", "Только через grpc-web/прокси"] }
    - { k: "HTTP-кэширование", v: ["Работает штатно", "Практически нет", "Нет"] }
    - { k: "Over-fetching", v: ["Есть — клиент берёт лишнее", "Нет — клиент выбирает поля", "Нет — контракт жёсткий"] }
    - { k: "Риск N+1", v: ["Контролируется в контроллере", "Высокий — нужен dataloader", "Контролируется"] }
    - { k: "Авторизация", v: ["На уровне действия", "На каждом поле", "На уровне метода"] }
    - { k: "Поддержка в Ruby", v: ["Родная", "graphql-ruby — зрелый", "Слабая относительно Go/Java"] }
    - { k: "Когда выбирать", v: ["Почти всегда", "Много разных клиентов с разными потребностями", "Внутренний обмен между сервисами под нагрузкой"] }
  verdict: "REST по умолчанию. GraphQL — когда несколько независимых клиентов просят разные срезы одних данных. gRPC — только для сервис-сервис обмена, и почти никогда как первый выбор в Rails."

- id: architecture
  title: "Монолит vs Модульный монолит vs Микросервисы"
  lead: "Границы системы стоит проводить по командам, а не по сущностям."
  columns: ["Монолит", "Модульный монолит", "Микросервисы"]
  rows:
    - { k: "Деплой", v: ["Один", "Один", "N независимых"] }
    - { k: "Транзакции между модулями", v: ["Обычные, БД гарантирует", "Обычные", "Saga, eventual consistency"] }
    - { k: "Границы", v: ["Держатся на дисциплине", "Проверяются статически (Packwerk)", "Физические"] }
    - { k: "Отладка сценария", v: ["Один стек-трейс", "Один стек-трейс", "Распределённая трассировка"] }
    - { k: "Независимое масштабирование", v: ["Нет", "Нет", "Да"] }
    - { k: "Порог по размеру команды", v: ["1–10", "5–30", "20+"] }
    - { k: "Инфраструктурный налог", v: ["Минимальный", "Минимальный", "Высокий: discovery, трейсинг, контракты"] }
  verdict: "Почти всем нужен монолит. Модульный монолит — когда команд стало больше одной. Микросервисы — когда независимый деплой команд стоит дороже, чем накладные расходы распределённой системы. Обратный путь (из микросервисов в монолит) проходили многие."

- id: deploy
  title: "Kamal vs PaaS vs Kubernetes"
  lead: "Rails 8 генерирует Dockerfile и config/deploy.yml — деплой на свой сервер стал дефолтом."
  columns: ["Kamal 2 → VPS", "PaaS (Render/Fly/Heroku)", "Kubernetes"]
  rows:
    - { k: "Стоимость на старте", v: ["$5–40/мес", "$25–200/мес", "$100+/мес и платформенная команда"] }
    - { k: "Время до первого деплоя", v: ["Часы", "Минуты", "Дни–недели"] }
    - { k: "Zero-downtime", v: ["Есть, через kamal-proxy", "Есть", "Есть"] }
    - { k: "TLS", v: ["Автоматически (Let's Encrypt)", "Автоматически", "cert-manager"] }
    - { k: "Rollback", v: ["kamal rollback", "Одна кнопка", "kubectl rollout undo"] }
    - { k: "Кто обслуживает ОС", v: ["Вы", "Платформа", "Платформенная команда"] }
    - { k: "Автоскейл", v: ["Нет (руками добавить сервер)", "Есть", "Есть, тонко настраиваемый"] }
    - { k: "Vendor lock", v: ["Нет — любой сервер с SSH", "Есть", "Нет, но сложность высока"] }
  verdict: "Kamal на VPS — лучшее соотношение цены и контроля для 95% Rails-проектов. PaaS — когда время дороже денег. Kubernetes — только если он уже есть в компании."

- id: pagination
  title: "Pagy vs Kaminari vs курсорная пагинация"
  lead: "Мелочь, которая заметна на списках из сотен тысяч записей."
  columns: ["Pagy", "Kaminari", "Keyset / cursor"]
  rows:
    - { k: "Аллокации на страницу", v: ["Минимальные", "В разы больше", "Минимальные"] }
    - { k: "Зависимости", v: ["Нет", "Есть", "Нет"] }
    - { k: "Переход на N-ю страницу", v: ["Да", "Да", "Нет"] }
    - { k: "Время ответа на глубоких страницах", v: ["Деградирует (OFFSET)", "Деградирует (OFFSET)", "Постоянное"] }
    - { k: "Стабильность при вставках", v: ["Записи «прыгают»", "Записи «прыгают»", "Стабильно"] }
    - { k: "Готовые шаблоны", v: ["Хелперы под Tailwind/Bootstrap", "Генератор вьюх", "Пишете сами"] }
  verdict: "Pagy — разумный дефолт. Kaminari — если нужны настраиваемые шаблоны в админке. Курсорная — для бесконечных лент и мобильного API. Ransack добавляйте только с явным списком ransackable_attributes, иначе получите утечку данных через параметры."

- id: monolith_frontend
  title: "Hotwire vs Inertia vs SPA + API"
  lead: "Главная развилка фронтенда в Rails-проекте 2026 года."
  columns: ["Hotwire", "Inertia.js", "SPA + Rails API"]
  rows:
    - { k: "Где живут вьюхи", v: ["ERB/Phlex на сервере", "React/Vue компоненты", "Отдельное приложение"] }
    - { k: "Роутинг", v: ["Rails", "Rails", "Клиентский"] }
    - { k: "Нужен ли API", v: ["Нет", "Нет", "Да, версионированный"] }
    - { k: "Дублирование валидаций", v: ["Нет", "Минимальное", "Полное"] }
    - { k: "SEO", v: ["Из коробки", "Нужен SSR-процесс на Node", "Нужен Next/Nuxt"] }
    - { k: "Репозиториев", v: ["1", "1", "2"] }
    - { k: "Тулчейнов", v: ["1 (или 0 с importmap)", "2", "2+"] }
    - { k: "Сложное клиентское состояние", v: ["Неудобно", "Родная территория", "Родная территория"] }
    - { k: "Мобильное приложение", v: ["Hotwire Native из тех же вьюх", "Нужен API отдельно", "Тот же API"] }
    - { k: "Кому подходит", v: ["Fullstack Rails-команда", "Есть фронтендеры, нужен богатый UI", "Выделенные фронтенд- и бэкенд-команды"] }
  verdict: "Hotwire покрывает большинство интерфейсов и остаётся первым выбором. Inertia — золотая середина, когда в команде есть React/Vue-разработчики: серверный роутинг сохраняется, API писать не нужно. SPA + API оправдан выделенной фронтенд-командой или общим API для мобильного клиента."
