# Опорные кейсы: реальные production-приложения, описанные обезличенно.
# Профиль совпадает по структуре с анкетой, поэтому движок находит похожие проекты.
- id: mutual_aid
  name: "Платформа взаимопомощи"
  tagline: "Заявки о помощи, отклики, чат, репутация и модерация"
  scale_note: "15 моделей · 29 контроллеров · 30 таблиц · 47 тестов"
  profile:
    project_type: mvp
    domain: medium
    timeline: product
    ui: crud
    seo: important
    realtime: chat
    mobile: none
    team: solo
    rails_exp: middle
    scale: small
    infra: vps_cheap
    compliance: pii
  stack:
    Rails: "8.0.3"
    Рендеринг: "SSR + Hotwire (Turbo/Stimulus)"
    Ассеты: "Propshaft + Importmap + Tailwind"
    БД: "PostgreSQL"
    Фон: "Solid Queue / Cache / Cable"
    Auth: "Devise + OmniAuth Google"
    Права: "Pundit"
    Пагинация: "Kaminari"
    Файлы: "Active Storage + S3"
    Деплой: "Kamal 2 → VPS, TLS через kamal-proxy"
    Наблюдаемость: "Sentry + rack-attack"
  lessons:
    - "Solid Trifecta закрыла и очередь, и кэш, и чат — Redis не понадобился ни разу"
    - "Слой app/services + app/policies появился на 3-й месяц, когда контроллеры перевалили за 60 строк"
    - "Три языка интерфейса заложены сразу — доставать строки из вьюх задним числом дороже"

