# ---------------------------------------------------------------
# Rails Stack Advisor — Jekyll / GitHub Pages
# ---------------------------------------------------------------
title: "Rails Stack Advisor"
tagline: "Выбор подхода, архитектуры и стека для Ruby on Rails"
description: >-
  Интерактивный подборщик стека, архитектуры и конфигурации Ruby on Rails 8:
  рендеринг, фронтенд, фон/кэш, аутентификация, тестирование, деплой —
  с обоснованием каждого решения и генерацией плана реализации.
lang: ru

# Для user/organization pages (login.github.io) оставьте baseurl пустым.
# Для project pages (login.github.io/rails-stack-advisor) укажите "/rails-stack-advisor".
baseurl: ""
url: ""

author: "Ruslan"
repo: "https://github.com/ruslanux/rails-stack-advisor"

plugins:
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .github

defaults:
  - scope: { path: "" }
    values: { layout: "default" }

# Версии, на которые опирается база знаний (правится в одном месте)
versions:
  rails: "8.1"
  ruby: "3.4.4"
  updated: "2026-08"
